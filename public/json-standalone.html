<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Viewer — FN Asset Path Finder</title><meta name="theme-color" content="#12131a"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#12131a;color:#e9e9ef;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:1.25rem}.wrap{max-width:64rem;margin:auto}a{display:inline-block;color:#9b9cab;text-decoration:none;padding:.6rem .75rem;border-radius:.5rem}a:hover{background:#2a2b36;color:#e9e9ef}h1{color:#ff8a3d;font-size:1.5rem;margin:1rem 0 .5rem}.path{color:#9b9cab;font-size:.8rem;overflow-wrap:anywhere}pre{margin-top:1.25rem;padding:1rem;border:1px solid #33343f;border-radius:1rem;background:#1b1c25;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.8rem;line-height:1.55}</style></head><body><main class="wrap"><a href="index.html">← Back</a><h1>JSON Viewer</h1><div class="path" id="path">—</div><pre id="json">Loading…</pre></main><script>const path=new URLSearchParams(location.search).get('path');document.getElementById('path').textContent=path||'—';if(!path){document.getElementById('json').textContent='No path provided.'}else fetch('https://mattttiiaaasspathfinder.lovable.app/api/public/asset-json?path='+encodeURIComponent(path)).then(r=>r.text()).then(t=>{try{t=JSON.stringify(JSON.parse(t),null,4)}catch{}document.getElementById('json').textContent=t}).catch(()=>document.getElementById('json').textContent='Failed to load JSON.');</script></body></html>
