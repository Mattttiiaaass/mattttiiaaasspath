name: Deploy complete website from one YAML file

on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Create the complete website
        shell: bash
        run: |
          mkdir -p dist/.well-known
          echo '' | base64 --decode > dist/index.html
          echo '' | base64 --decode > dist/json.html
          sed -i 's#https://mattttiiaaasspathfinder.lovable.app/__l5e/assets-v1/54df028e-4de7-4ea9-8ff5-a7382f6ef011/fortnite_assets_all.gz#./fortnite_assets_all.gz#' dist/index.html
          sed -i 's#https://mattttiiaaasspathfinder.lovable.app/__l5e/assets-v1/37d3d391-4c0e-4520-b0b1-7ddd8b7cddf9/fortnite_assets_new.gz#./fortnite_assets_new.gz#' dist/index.html
          sed -i 's#https://mattttiiaaasspathfinder.lovable.app/api/public/asset-json?path=#./json.html?path=#' dist/index.html
          curl --fail --location --retry 3 'https://mattttiiaaasspathfinder.lovable.app/__l5e/assets-v1/54df028e-4de7-4ea9-8ff5-a7382f6ef011/fortnite_assets_all.gz' --output dist/fortnite_assets_all.gz
          curl --fail --location --retry 3 'https://mattttiiaaasspathfinder.lovable.app/__l5e/assets-v1/37d3d391-4c0e-4520-b0b1-7ddd8b7cddf9/fortnite_assets_new.gz' --output dist/fortnite_assets_new.gz
          printf '%s' 'dh=107b26aed3ed2bea9776843368f0046b899b6d57' > dist/.well-known/discord
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
